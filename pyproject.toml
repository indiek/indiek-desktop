# The frozen backend of IndieK Desktop (DESKTOP:PACKAGING-TAURI P3): one binary,
# `indiek-sidecar`, built with PyInstaller from sidecar/indiek-sidecar.spec.
[project]
name = "indiek-desktop-sidecar"
version = "0.1.0"
description = "Frozen IndieK API and ik CLI bundled with IndieK Desktop."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    # Exact pins at release: the sidecar ships exactly what was tested.
    "indiek-api",
    "indiek[cli,keychain]==1.3.0",
]

[dependency-groups]
dev = ["pyinstaller>=6.16", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["sidecar"]
testpaths = ["tests"]

[tool.uv.sources]
# Until indiek-api is on PyPI (1.0.0, with the first desktop release): the local checkout.
# At release, drop this line and pin "indiek-api==1.0.0" above.
indiek-api = { path = "../fastAPI" }
