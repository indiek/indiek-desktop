name: Release desktop app

# Runs when the owner pushes a version tag (e.g. 0.2.0). Builds the installers on each OS
# (PyInstaller cannot cross-compile) and attaches them to a DRAFT GitHub Release; the owner
# checks it and publishes it by hand. The builds are not signed yet (owner decision 2026-10-24).
# A manual run (Actions tab → "Run workflow") builds the same installers as workflow artifacts
# only: no version check, no release.
on:
  push:
    tags:
      - '*.*.*' # Matches 0.2.0, 1.0.0, etc.
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest # Apple silicon
            bundles: app,dmg
          - runner: windows-latest
            bundles: msi,nsis
          - runner: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check tag matches the app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          crate=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d '"' -f2)
          echo "tag=${GITHUB_REF_NAME} package.json=$pkg tauri.conf.json=$conf Cargo.toml=$crate"
          test "$pkg" = "${GITHUB_REF_NAME}"
          test "$conf" = "${GITHUB_REF_NAME}"
          test "$crate" = "${GITHUB_REF_NAME}"

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Python tests
        run: uv run --locked pytest -q

      - name: Build the sidecar (PyInstaller)
        run: uv run --locked pyinstaller --noconfirm sidecar/indiek-sidecar.spec

      - name: Fetch the pinned web UI (web-ui.lock.json)
        run: uv run --locked python scripts/fetch_web_ui.py

      - name: Build the app and installers
        run: |
          npm ci
          npm run build -- --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  # One job creates the release, so parallel builds never race to create several drafts.
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Checksums
        working-directory: installers
        run: sha256sum * > SHA256SUMS.txt

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: installers/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
