name: Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Python tests (sidecar entry point, web UI fetcher)
        run: uv run --locked pytest -q

      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # tauri-build checks that every bundle resource exists; the real ones are built only
      # by the release workflow.
      - name: Placeholder bundle resources
        run: mkdir -p dist/indiek-sidecar web-dist

      - name: Format (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
